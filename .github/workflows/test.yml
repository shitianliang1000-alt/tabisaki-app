name: Unit tests

# 2026-10-22 から、GitHub はコードの置き場（とテスト）だけです。
# 公開は GitHub Pages ではなく、Cloudflare Worker（wrangler.jsonc）と
# PHP 版（InfinityFree。php/・tools/build_php.sh）が受け持ちます。
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in js/*.js sw.js server/*.js tools/*.mjs packages/*/*.mjs packages/cli/bin/*.mjs; do node --check "$f"; done
      - name: Unit tests
        run: node --test tests/*.test.js
      # 知識ベースの点検（誤りは単体試験でも止まります。ここでは件数と
      # 気になる点を、実行結果のまとめ欄に出します）
      - name: Knowledge base check
        run: node tools/kb_check.mjs --md >> "$GITHUB_STEP_SUMMARY"
      # 翻訳の点検（原文に無い鍵や差し込みの食い違いは誤りで止め、訳の進み具合をまとめ欄に出す）
      - name: Translation check
        run: node tools/i18n_check.mjs --md >> "$GITHUB_STEP_SUMMARY"
      # PHP 版（InfinityFree 向け）を組み立てて、書きまちがいが無いかを見ます。
      - name: PHP site build and lint
        run: |
          npm install --no-save --no-package-lock esbuild@0.25.10
          sh tools/build_php.sh .php-site
          php -S 127.0.0.1:8090 -t .php-site tools/php_router.php >/dev/null 2>&1 &
          sleep 1
          # トップ（index.php）と、チャットの画面（/app → app.php）
          curl -sSf http://127.0.0.1:8090/ | grep -q 'id="stage"'
          curl -sSf http://127.0.0.1:8090/app | grep -q 'id="plus-sep-tune"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/inc/landing.html)" = 403
          # /app/ は /app へ移す（そのままだと css/・js/ が /app/ の下を探して崩れる）
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' 'http://127.0.0.1:8090/app/?q=x')" = "301 http://127.0.0.1:8090/app?q=x"
      # Cloudflare 用の組み立て（トップのひな形・データ・管理画面が入るか）
      - name: Cloudflare site build
        run: |
          sh tools/build_worker.sh .site
          test -f .site/__site/landing.html && test -f .site/data/areas.json && test -f .site/assets/landing.js
          test -f .site/__admin/index.html

  # 手元用 API サーバー（Dockerfile・compose.yaml）が、組み上がって旅程を返すか。
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: |
          docker build -t tabisaki-api .
          docker run -d --name api -p 127.0.0.1:8787:8787 tabisaki-api
          for i in $(seq 1 30); do
            curl -sSf http://127.0.0.1:8787/health && break
            sleep 1
          done
          curl -sSf -X POST http://127.0.0.1:8787/plan -H 'Content-Type: application/json' \
            -d '{"wish":"温泉と海","days":2}' | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8787/plan -H 'Content-Type: application/json' -d '{"wish":""}')" = 400
      - name: Logs
        if: always()
        run: docker logs api || true

  # 画面のテスト。関数が全部正しくても、ボタンが繋がっていなければ
  # 旅程は作れません（tests/e2e/README.md）。外へは出ない前提で動かします。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save playwright-core axe-core esbuild@0.25.10
          npx playwright-core install --with-deps chromium
      # 公開と同じ組み立て（注釈を削ったもの）を見ます。削りかたで壊れて
      # いても、手元のファイルを見ていては気づけません。
      # tests/ は公開しませんが、画面のテストが使う見本のページがあるので、
      # ここでだけ横に置きます。
      - name: Build the site
        env:
          REQUIRE_MINIFY: "1"
        run: |
          sh tools/build_site.sh dist
          cp -r tests dist/tests
      - name: Serve the site
        working-directory: dist
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &
          for i in $(seq 1 20); do
            curl -sSf -o /dev/null http://127.0.0.1:8000/index.html && break
            sleep 0.5
          done
      - name: Browser test
        env:
          BASE_URL: http://127.0.0.1:8000
          E2E_OFFLINE: "1"
        run: node tests/e2e/run.mjs

      # 読める状態かを測ります。薄い灰色の注意書きや、ボタンの中のボタンは、
      # 目で見ているぶんには気づけません。
      - name: Accessibility test
        env:
          BASE_URL: http://127.0.0.1:8000
        run: node tests/e2e/a11y.mjs

      # ホーム画面に足した直後に圏外になり、そのまま開いたとき（start_url の /app）。
      # /app は Worker・PHP が返すページなので、PHP 版を組んで確かめます。
      - name: Offline launch test (PHP site)
        run: |
          sh tools/build_php.sh .php-site
          php -S 127.0.0.1:8090 -t .php-site tools/php_router.php >/dev/null 2>&1 &
          for i in $(seq 1 20); do
            curl -sSf -o /dev/null http://127.0.0.1:8090/app && break
            sleep 0.5
          done
          BASE_URL=http://127.0.0.1:8090 node tests/e2e/offline-launch.mjs
