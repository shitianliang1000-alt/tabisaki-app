name: Unit tests

# 2026-10-22 から、GitHub はコードの置き場（とテスト）だけです。
# 公開は GitHub Pages ではなく、Cloudflare Worker（wrangler.jsonc）と
# PHP 版（InfinityFree。php/・tools/build_php.sh）が受け持ちます。
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: for f in js/*.js sw.js; do node --check "$f"; done
      - name: Unit tests
        run: node --test tests/*.test.js
      # PHP 版（InfinityFree 向け）を組み立てて、書きまちがいが無いかを見ます。
      - name: PHP site build and lint
        run: |
          npm install --no-save --no-package-lock esbuild@0.25.10
          sh tools/build_php.sh .php-site
          php -S 127.0.0.1:8090 -t .php-site >/dev/null 2>&1 &
          sleep 1
          curl -sSf http://127.0.0.1:8090/index.php | grep -q 'id="tune-row"'
          curl -sSf http://127.0.0.1:8090/about.php | grep -q 'class="card-name"'

  # 画面のテスト。関数が全部正しくても、ボタンが繋がっていなければ
  # 旅程は作れません（tests/e2e/README.md）。外へは出ない前提で動かします。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save playwright-core axe-core esbuild@0.25.10
          npx playwright-core install --with-deps chromium
      # 公開と同じ組み立て（注釈を削ったもの）を見ます。削りかたで壊れて
      # いても、手元のファイルを見ていては気づけません。
      # tests/ は公開しませんが、画面のテストが使う見本のページがあるので、
      # ここでだけ横に置きます。
      - name: Build the site
        env:
          REQUIRE_MINIFY: "1"
        run: |
          sh tools/build_site.sh dist
          cp -r tests dist/tests
      - name: Serve the site
        working-directory: dist
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &
          for i in $(seq 1 20); do
            curl -sSf -o /dev/null http://127.0.0.1:8000/index.html && break
            sleep 0.5
          done
      - name: Browser test
        env:
          BASE_URL: http://127.0.0.1:8000
          E2E_OFFLINE: "1"
        run: node tests/e2e/run.mjs

      # 読める状態かを測ります。薄い灰色の注意書きや、ボタンの中のボタンは、
      # 目で見ているぶんには気づけません。
      - name: Accessibility test
        env:
          BASE_URL: http://127.0.0.1:8000
        run: node tests/e2e/a11y.mjs
