name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# 書き込みの権限は公開のジョブだけに渡します（下の deploy）。
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 単体テスト・画面のテスト・読み上げと色のテストを先に走らせます。
  # どれかが赤なら、公開はしません（前に公開したものがそのまま残ります）。
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 注釈を削る道具（tools/optimize_site.mjs）。版は固定します。
      - name: Install build tools
        run: npm install --no-save --no-package-lock esbuild@0.25.10

      # 何を公開するかは tools/build_site.sh に書いてあります
      # （画面のテストも同じものを組み立てて見ます）。
      # admin/ は入れません。認証が無く、置けば誰でも開けます。
      - name: Stage site files
        env:
          REQUIRE_MINIFY: "1"
        run: |
          set -eu
          sh tools/build_site.sh dist
          # 何かの拍子に紛れ込んだら、公開する前に止めます
          if [ -e dist/admin ]; then echo "dist/admin must not be published" >&2; exit 1; fi
          du -sh dist
          find dist -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
