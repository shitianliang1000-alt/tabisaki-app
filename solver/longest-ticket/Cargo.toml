[package]
name = "longest-ticket"
version = "0.1.0"
edition = "2021"
description = "最長片道切符（同じ駅を二度通らない最長の経路）を求めるソルバー"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "longest-ticket"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
