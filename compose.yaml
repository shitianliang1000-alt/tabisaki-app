# 旅さきの手元用 API サーバー
#     docker compose up
#     curl -X POST http://127.0.0.1:8787/v1/plan -H 'Content-Type: application/json' -d '{"wish":"温泉と海","days":2}'
#
# 認証なしで動かすので、この端末の中（127.0.0.1）にだけ出しています。
# ほかの端末から使うときは、TABISAKI_NO_AUTH を消して TABISAKI_API_TOKEN を入れ、
# 手前に HTTPS の逆プロキシを置いてください（docs/api.md）。
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      # 入れ物の中では 0.0.0.0 で待ち受けるので、認証なしは明示して許します。
      # 外に出すのは上の 127.0.0.1:8787 だけです。
      TABISAKI_NO_AUTH: "1"
      # TABISAKI_API_TOKEN: "openssl rand -hex 32 で作った鍵"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp

  # ── OpenTripPlanner（乗り換え検索を手元で。Issue #429、docs/otp.md） ──
  # ふつうの docker compose up では動きません（--profile otp のときだけ）。
  #     python3 tools/otp_fetch.py                        # 時刻表と地図を data/otp/kumamoto/ に集める
  #     docker compose --profile otp run --rm otp-build   # 経路網を組み立てる（graph.obj）
  #     docker compose --profile otp up -d otp            # http://127.0.0.1:8080/otp/gtfs/v1
  # 中継（server/node-proxy.mjs）に OTP_URL=http://127.0.0.1:8080 を入れると、乗り換え検索で使います。
  otp-build:
    profiles: ["otp"]
    image: &otp-image opentripplanner/opentripplanner:2.6.0@sha256:5027834b4a5e2b52deacbe65a97ec614fe1bf36a87297bfc0fd4142121cd3185
    command: ["--build", "--save"]
    environment:
      JAVA_OPTS: "-Xmx6g"
    volumes:
      - ./data/otp/${OTP_REGION:-kumamoto}:/var/opentripplanner
  otp:
    profiles: ["otp"]
    image: *otp-image
    command: ["--load", "--serve"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JAVA_OPTS: "-Xmx4g"
    volumes:
      - ./data/otp/${OTP_REGION:-kumamoto}:/var/opentripplanner:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/otp/actuators/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
